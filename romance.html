<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Romance Anime - Watch List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

 <main class="main-container">
    <div class="layout-wrapper">
      
      <h2 class="sidebar-title">Romance</h2>

      <div class="grid-card-wrapper">
        <div class="black-spacer-bar"></div>

        <div class="search-container">
  <input type="text" id="animeSearch" placeholder="Search anime...">
</div>

        <div class="category-grid anime-page-grid">

          <div class="category-card anime-card">
            <div class="content-box anime-box">
              <span></span>
            </div>
            <div class="description-box">
              <p>Your Lie in April</p>
            </div>
          </div>

          <div class="category-card anime-card">
            <div class="content-box anime-box">
              <span></span>
            </div>
            <div class="description-box">
              <p>My Dress-Up Darling</p>
            </div>
          </div>

          <div class="category-card anime-card">
            <div class="content-box anime-box">
              <span></span>
            </div>
            <div class="description-box">
              <p>Horimiya</p>
            </div>
          </div>

          <div class="category-card anime-card">
            <div class="content-box anime-box">
              <span></span>
            </div>
            <div class="description-box">
              <p>Kaguya-sama: Love is War</p>
            </div>
          </div>

          <div class="category-card anime-card">
            <div class="content-box anime-box">
              <span></span>
            </div>
            <div class="description-box">
              <p>Alya Sometimes Hides Her Feelings in Russian</p>
            </div>
          </div>

          <div class="category-card anime-card">
            <div class="content-box anime-box">
              <span></span>
            </div>
            <div class="description-box">
              <p>Clannad: After Story</p>
            </div>
          </div>

          <div class="category-card anime-card">
            <div class="content-box anime-box">
              <span></span>
            </div>
            <div class="description-box">
              <p>Toradora</p>
            </div>
          </div>

          <div class="category-card anime-card">
            <div class="content-box anime-box">
              <span></span>
            </div>
            <div class="description-box">
              <p>Kubo Won’t Let Me Be Invisible</p>
            </div>
          </div>

        </div>
      </div>

    </div>
  </main>

  <script>
    const searchInput = document.getElementById('animeSearch');
    const animeCards = document.querySelectorAll('.category-card');

    searchInput.addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase().trim();

      animeCards.forEach(card => {
        const title = card.querySelector('.description-box p').textContent.toLowerCase();

        if (title.includes(searchTerm)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    });
  </script>
</body>
</html>
